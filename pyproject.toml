[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "peerc"
version = "1.18.2"
description = "Peer-to-peer terminal chat and file transfer application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=8.0",
    "rich>=13.0",
    "cryptography>=42.0",
    "keyring>=24.0",
]

[project.optional-dependencies]
# Phase 5.2: mDNS discovery via zeroconf.
# Install with: pip install peerc[mdns]
# When not installed, discovery falls back to UDP broadcast only.
mdns = ["zeroconf>=0.131"]
# Phase 44.3: terminal QR code rendering for Add-by-Link.
# Install with: pip install peerc[qr]
# When not installed, Add-by-Link's copy-paste string form still works
# fully — QR is purely an additional way to render the same string.
qr = ["qrcode>=7.4"]

[project.scripts]
peerc = "ui:main"
pchat = "ui:main"

[tool.setuptools]
py-modules = ["chat", "discovery", "file_transfer", "peer", "protocol", "ui"]
packages = ["core", "core.protocol", "core.identity", "core.trust", "core.crypto", "core.transport", "core.transfer", "core.security", "core.vault", "core.group"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
