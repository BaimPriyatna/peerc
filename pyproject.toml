[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "peerc"
version = "1.22.6"
description = "Peer-to-peer terminal chat and file transfer application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=8.0",
    "rich>=13.0",
    "cryptography>=42.0",
    "keyring>=24.0",
]

[project.optional-dependencies]
# Phase 5.2: mDNS discovery via zeroconf.
# Install with: pip install peerc[mdns]
# When not installed, discovery falls back to UDP broadcast only.
mdns = ["zeroconf>=0.131"]
# Phase 44.3: terminal QR code rendering for Add-by-Link.
# Install with: pip install peerc[qr]
# When not installed, Add-by-Link's copy-paste string form still works
# fully — QR is purely an additional way to render the same string.
qr = ["qrcode>=7.4"]

[project.scripts]
peerc = "app.main:main"

[tool.setuptools]
py-modules = ["chat", "discovery", "file_transfer", "peer", "protocol", "ui"]

[tool.setuptools.packages.find]
# Phase 38: discover nested packages instead of enumerating them by hand.
include = ["app", "app.*", "core", "core.*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-m 'not benchmark'"
markers = [
    "unit: fast, no I/O, no event loop dependency beyond a single coroutine under test",
    "integration: exercises two or more real components together (e.g. two ConnectionManagers over a real socket)",
    "ui: drives the Textual App via app.run_test()/Pilot",
    "security: handshake, trust, vault, group-policy, or crypto behavior where a failure is a security regression",
    "benchmark: measures performance against a budget (Phase 31+; none yet — reserved)",
]
